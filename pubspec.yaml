name: mybike
description: "MYBIKE — Multi-Showroom Bike Dealership Management & Accounting ERP"
publish_to: 'none'

version: 1.0.0+100

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management — flutter_bloc 9.1.1
  # Why: User-selected state management. Mature, testable, scalable.
  # Platforms: All (Android, iOS, Web, Windows)
  # Maintained: Very actively maintained by Felix Angelov / VGV
  flutter_bloc: ^9.1.1

  # Routing — go_router ^17.5.0
  # Why: Declarative routing with deep linking, guards, nested navigation.
  # Platforms: All (Android, iOS, Web, Windows)
  # Maintained: Maintained by Flutter team
  go_router: ^17.5.0

  # Value Equality — equatable 2.1.0
  # Why: Clean equality for Bloc states/events without boilerplate.
  # Platforms: All (pure Dart)
  # Maintained: By Felix Angelov / VGV
  equatable: ^2.1.0

  # Local Storage — shared_preferences 2.5.3
  # Why: Persist theme preference, selected showroom, small key-value data.
  # Platforms: All (Android, iOS, Web, Windows)
  # Maintained: By Flutter team (first-party)
  shared_preferences: ^2.5.3

  # Internationalization — intl
  # Why: Date/number/currency formatting, multi-language foundation.
  # Platforms: All (pure Dart)
  # Maintained: By Dart team (first-party)
  intl: any

  cupertino_icons: ^1.0.8

  # Supabase SDK — supabase_flutter
  # Why: Direct PostgreSQL access, Auth, Storage, and Realtime synchronization.
  # Platforms: All (Android, iOS, Web, Windows)
  supabase_flutter: ^2.8.0
  pdf: ^3.13.1
  printing: ^5.15.1
  csv: ^8.0.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
